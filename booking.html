<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking — Stirrup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f9f8f5;color:#1a1a18;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:#fff;border-bottom:1px solid #e8e6e0}
.logo{font-size:18px;font-weight:600;color:#1a1a18;text-decoration:none}
.nav-right{display:flex;gap:10px}
.btn{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;font-family:'Inter',sans-serif;border:1px solid transparent}
.btn-primary{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn-primary:hover{background:#178a64}
.btn-ghost{background:transparent;border-color:#d4d2cb;color:#1a1a18}
.btn-ghost:hover{background:#f0efe9}
.btn-danger{background:transparent;border-color:#e8c5c5;color:#c0392b}
.btn-danger:hover{background:#fcebeb}
.wrap{max-width:600px;margin:0 auto;padding:2rem}
.booking-header{margin-bottom:1.5rem}
.booking-title{font-size:22px;font-weight:600;margin-bottom:4px}
.booking-meta{font-size:13px;color:#5a5a55}
.card{background:#fff;border:1px solid #e8e6e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.card-title{font-size:14px;font-weight:600;color:#1a1a18;margin-bottom:.75rem}
.info-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid #f0efe9}
.info-row:last-child{border-bottom:none}
.info-label{color:#5a5a55}
.info-val{font-weight:500;color:#1a1a18}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.pill-green{background:#e0f5ed;color:#0f6e47}
.pill-amber{background:#faeeda;color:#633806}
.pill-blue{background:#e6f0fb;color:#0c447c}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:500;color:#3a3a35;margin-bottom:4px}
.field select{width:100%;padding:9px 12px;border:1px solid #d4d2cb;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;outline:none;background:#fff;color:#1a1a18}
.field select:focus{border-color:#1D9E75}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal-label{font-size:11px;color:#8a8a85;text-align:center;padding-bottom:4px}
.cal-day{height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;border:1px solid transparent;transition:all .15s;background:#f0efe9;color:#1a1a18}
.cal-day:hover{border-color:#d4d2cb}
.cal-day.sel{background:#e0f5ed;color:#0f6e47;border-color:#1D9E75;font-weight:600}
.cal-day.off{background:transparent;color:#d4d2cb;cursor:default}
.cal-day.past{background:#f9f8f5;color:#c8c6bf;cursor:not-allowed}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.time-btn{padding:8px;border-radius:8px;font-size:12px;text-align:center;border:1px solid #d4d2cb;background:#fff;cursor:pointer;color:#1a1a18;transition:all .15s;font-family:'Inter',sans-serif}
.time-btn.sel{background:#e0f5ed;border-color:#1D9E75;color:#0f6e47;font-weight:500}
.time-btn:hover{background:#f0efe9}
.time-btn.taken{background:#f0efe9;color:#c8c6bf;cursor:default;text-decoration:line-through}
.pay-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.pay-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid #d4d2cb;background:#fff;cursor:pointer;transition:all .15s}
.pay-opt.sel{background:#e0f5ed;border-color:#1D9E75}
.pay-radio{width:16px;height:16px;border-radius:50%;border:1.5px solid #d4d2cb;flex-shrink:0;margin-top:2px;transition:all .15s}
.pay-radio.sel{background:#1D9E75;border-color:#1D9E75}
.pay-opt-title{font-size:13px;font-weight:500;color:#1a1a18}
.pay-opt-sub{font-size:11px;color:#5a5a55;margin-top:2px;line-height:1.4}
.upcoming-notice{background:#e6f0fb;border:1px solid #85b7eb;border-radius:10px;padding:12px;font-size:13px;color:#0c447c;line-height:1.6}
.error{background:#fcebeb;color:#c0392b;font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.success{background:#e0f5ed;color:#0f6e47;font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none}
.loading{text-align:center;padding:3rem;color:#8a8a85;font-size:14px}
</style>
</head>
<body>
<nav>
  <a href="dashboard.html" class="logo">Stirrup</a>
  <div class="nav-right">
    <a href="dashboard.html" class="btn btn-ghost">← Dashboard</a>
  </div>
</nav>

<div class="wrap">
  <div id="main-content"><div class="loading">Loading booking…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mfinlbqfowymmklhkuhb.supabase.co';
const SUPABASE_KEY='sb_publishable_PcwbX1YoncwnrHobFmpAIA_L39K4XfK';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// Safely fetch the current user. Returns the user object, or null if
// genuinely signed out. On a network/connection error (not an auth
// failure), shows a retry message instead of bouncing to login —
// a dropped request doesn't mean the session is invalid.
async function getUserSafe(){
  try{
    const {data,error}=await db.auth.getUser();
    if(error){
      if(confirm('Connection problem — could not verify your session.\n\nTap OK to try again, or Cancel to go to the login page.')){
        return getUserSafe();
      }
      window.location.href='login.html';
      return null;
    }
    return data?.user||null;
  }catch(e){
    if(confirm('Connection problem — could not verify your session.\n\nTap OK to try again, or Cancel to go to the login page.')){
      return getUserSafe();
    }
    window.location.href='login.html';
    return null;
  }
}

let booking=null,allHorses=[],allBookings=[],userId=null;
let selDay=null,selTime=null;
const times=['8:00 AM','9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM'];
const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const today=new Date();today.setHours(0,0,0,0);

function lessonHasPassed(){
  if(!booking.scheduled_date)return false;
  const d=new Date(booking.scheduled_date);d.setHours(0,0,0,0);
  return d<today;
}

function isHorseBooked(horseId,dateStr,timeStr){
  if(!horseId)return false;
  return allBookings.some(b=>b.horse_id===horseId&&b.date===dateStr&&b.time===timeStr&&b.id!==booking.id);
}

function renderCal(){
  const g=document.getElementById('reschedule-cal');
  if(!g)return;
  g.innerHTML='';
  days.forEach(d=>{const l=document.createElement('div');l.className='cal-label';l.textContent=d;g.appendChild(l);});
  const now=new Date();
  const firstDay=new Date(now.getFullYear(),now.getMonth(),1).getDay();
  const daysInMonth=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const offset=(firstDay+6)%7;
  for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='cal-day off';g.appendChild(e);}
  for(let d=1;d<=daysInMonth;d++){
    const dow=(offset+d-1)%7;
    const isWeekday=dow<5;
    const thisDate=new Date(now.getFullYear(),now.getMonth(),d);
    const isPast=thisDate<today;
    const el=document.createElement('div');
    if(!isWeekday){el.className='cal-day off';}
    else if(isPast){el.className='cal-day past';}
    else{
      el.className='cal-day'+(d===selDay?' sel':'');
      el.onclick=()=>{selDay=d;selTime=null;renderCal();renderTimes();};
    }
    el.textContent=d;
    g.appendChild(el);
  }
}

function renderTimes(){
  const g=document.getElementById('reschedule-times');
  if(!g||!selDay)return;
  const now=new Date();
  const dateStr=`${now.toLocaleString('default',{month:'long'})} ${selDay}`;
  g.innerHTML='';
  times.forEach(t=>{
    const conflict=isHorseBooked(booking.horse_id,dateStr,t);
    const btn=document.createElement('button');
    btn.className='time-btn'+(conflict?' taken':t===selTime?' sel':'');
    btn.textContent=t;
    if(!conflict)btn.onclick=()=>{selTime=t;renderTimes();};
    else btn.disabled=true;
    g.appendChild(btn);
  });
}

async function saveReschedule(){
  if(!selDay||!selTime){showError('Please select a date and time.');return;}
  const now=new Date();
  const dateStr=`${now.toLocaleString('default',{month:'long'})} ${selDay}`;
  const scheduledDate=new Date(now.getFullYear(),now.getMonth(),selDay).toISOString().split('T')[0];
  const oldDate=booking.date;
  const {error}=await db.from('bookings').update({
    date:dateStr,time:selTime,scheduled_date:scheduledDate,payment_status:'upcoming'
  }).eq('id',booking.id);
  if(error){showError(error.message);return;}
  await db.from('activity_log').insert({
    trainer_id:userId,action:'booking_rescheduled',
    entity_type:'booking',entity_name:booking.rider_name,
    meta:{old_date:oldDate,new_date:dateStr,time:selTime}
  });
  showSuccess('Booking rescheduled to '+dateStr+' at '+selTime);
  booking.date=dateStr;booking.time=selTime;
  booking.scheduled_date=scheduledDate;booking.payment_status='upcoming';
  document.getElementById('disp-date').textContent=dateStr+' at '+selTime;
  document.getElementById('payment-pill').className='pill pill-blue';
  document.getElementById('payment-pill').textContent='upcoming';
  renderPaymentSection();
}

async function handlePayment(action){
  if(action==='received'){
    const {error}=await db.from('bookings').update({payment_status:'paid'}).eq('id',booking.id);
    if(error){showError(error.message);return;}
    await db.from('activity_log').insert({
      trainer_id:userId,action:'payment_received',
      entity_type:'booking',entity_name:booking.rider_name,
      meta:{amount:booking.price,lesson_type:booking.lesson_type}
    });
    booking.payment_status='paid';
    showSuccess('Payment marked as received.');
    renderPaymentSection();
  } else if(action==='square'){
    await db.from('activity_log').insert({
      trainer_id:userId,action:'payment_request_sent',
      entity_type:'booking',entity_name:booking.rider_name,
      meta:{amount:booking.price,lesson_type:booking.lesson_type}
    });
    showSuccess('Square payment link feature coming soon. For now, send the link manually from your Square account.');
  }
}

async function cancelBooking(){
  if(!confirm('Cancel this booking? This cannot be undone.'))return;
  const {error}=await db.from('bookings').delete().eq('id',booking.id);
  if(error){showError(error.message);return;}
  await db.from('activity_log').insert({
    trainer_id:userId,action:'booking_cancelled',
    entity_type:'booking',entity_name:booking.rider_name,
    meta:{lesson_type:booking.lesson_type,date:booking.date}
  });
  window.location.href='dashboard.html';
}

function showError(msg){
  const el=document.getElementById('msg-error');
  el.textContent=msg;el.style.display='block';
  document.getElementById('msg-success').style.display='none';
}

function showSuccess(msg){
  const el=document.getElementById('msg-success');
  el.textContent=msg;el.style.display='block';
  document.getElementById('msg-error').style.display='none';
}

function renderPaymentSection(){
  const container=document.getElementById('payment-section');
  const passed=lessonHasPassed();
  const status=booking.payment_status;

  if(status==='paid'){
    container.innerHTML=`
      <div class="card">
        <div class="card-title">Payment</div>
        <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:#0f6e47">
          <span style="font-size:20px">✓</span>
          <div><strong>Payment received</strong><div style="font-size:12px;color:#5a5a55;margin-top:2px">This lesson has been paid.</div></div>
        </div>
      </div>`;
    return;
  }

  if(!passed){
    container.innerHTML=`
      <div class="card">
        <div class="card-title">Payment</div>
        <div class="upcoming-notice">💳 Payment options will be available after the lesson date has passed.</div>
      </div>`;
    return;
  }

  container.innerHTML=`
    <div class="card">
      <div class="card-title">Payment</div>
      <div class="pay-opts">
        <div class="pay-opt sel" id="po-received" onclick="selPay('received')">
          <div class="pay-radio sel" id="pr-received"></div>
          <div><div class="pay-opt-title">Received Payment</div><div class="pay-opt-sub">Cash, check, Venmo, or already collected.</div></div>
        </div>
        <div class="pay-opt" id="po-square" onclick="selPay('square')">
          <div class="pay-radio" id="pr-square"></div>
          <div><div class="pay-opt-title">Send Square Link</div><div class="pay-opt-sub">Send rider a link to pay online via Square.</div></div>
        </div>
      </div>
      <button class="btn btn-primary" style="width:100%;padding:10px" onclick="confirmPayment()">Confirm</button>
    </div>`;
}

let selectedPayAction='received';
function selPay(action){
  selectedPayAction=action;
  ['received','square'].forEach(a=>{
    document.getElementById('po-'+a).classList.toggle('sel',a===action);
    document.getElementById('pr-'+a).classList.toggle('sel',a===action);
  });
}
function confirmPayment(){handlePayment(selectedPayAction);}

function render(){
  const horse=allHorses.find(h=>h.id===booking.horse_id);
  const statusPill=booking.payment_status==='paid'
    ?'<span class="pill pill-green" id="payment-pill">paid</span>'
    :booking.payment_status==='upcoming'
    ?'<span class="pill pill-blue" id="payment-pill">upcoming</span>'
    :'<span class="pill pill-amber" id="payment-pill">'+booking.payment_status+'</span>';

  document.getElementById('main-content').innerHTML=`
    <div class="booking-header">
      <div class="booking-title">${booking.rider_name}</div>
      <div class="booking-meta">${booking.lesson_type} · ${booking.date} at ${booking.time}</div>
    </div>
    <div class="error" id="msg-error"></div>
    <div class="success" id="msg-success"></div>
    <div class="card">
      <div class="card-title">Booking details</div>
      <div class="info-row"><span class="info-label">Rider</span><span class="info-val">${booking.rider_name}</span></div>
      <div class="info-row"><span class="info-label">Lesson type</span><span class="info-val">${booking.lesson_type}</span></div>
      <div class="info-row"><span class="info-label">Date & time</span><span class="info-val" id="disp-date">${booking.date} at ${booking.time}</span></div>
      <div class="info-row"><span class="info-label">Duration</span><span class="info-val">${booking.duration||'—'}</span></div>
      <div class="info-row"><span class="info-label">Horse</span><span class="info-val">${horse?horse.name:'None assigned'}</span></div>
      <div class="info-row"><span class="info-label">Trainer</span><span class="info-val">${booking.staff_trainer_name||'Head trainer'}</span></div>
      <div class="info-row"><span class="info-label">Price</span><span class="info-val">${booking.price||'—'}</span></div>
      <div class="info-row"><span class="info-label">Status</span><span class="info-val">${statusPill}</span></div>
      ${booking.notes?`<div class="info-row"><span class="info-label">Notes</span><span class="info-val">${booking.notes}</span></div>`:''}
    </div>
    <div id="payment-section"></div>
    <div class="card">
      <div class="card-title">Reschedule</div>
      <div class="cal-grid" id="reschedule-cal"></div>
      <div style="font-size:12px;color:#5a5a55;margin-bottom:8px">Select a new date then pick a time</div>
      <div class="time-grid" id="reschedule-times"></div>
      <button class="btn btn-primary" onclick="saveReschedule()" style="width:100%;padding:10px">Save new date & time</button>
    </div>
    <div class="card">
      <div class="card-title" style="color:#c0392b">Danger zone</div>
      <p style="font-size:13px;color:#5a5a55;margin-bottom:1rem">Cancelling removes this booking permanently.</p>
      <button class="btn btn-danger" style="width:100%;padding:10px" onclick="cancelBooking()">Cancel this booking</button>
    </div>`;

  renderPaymentSection();
  renderCal();
}

async function load(){
  const user=await getUserSafe();
  if(!user){return;}
  userId=user.id;
  const bookingData=JSON.parse(localStorage.getItem('stirrup_viewing_booking')||'null');
  if(!bookingData){window.location.href='dashboard.html';return;}
  booking=bookingData;
  const [{data:horses},{data:bookings}]=await Promise.all([
    db.from('horses').select('*').eq('trainer_id',user.id).eq('active',true),
    db.from('bookings').select('horse_id,date,time,id').eq('trainer_id',user.id)
  ]);
  allHorses=horses||[];
  allBookings=bookings||[];
  render();
}

load();
</script>
</body>
</html>
