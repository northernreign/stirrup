<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riders — Stirrup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f9f8f5;color:#1a1a18;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:#fff;border-bottom:1px solid #e8e6e0}
.logo{font-size:18px;font-weight:600;color:#1a1a18;text-decoration:none}
.nav-right{display:flex;align-items:center;gap:12px}
.btn{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;font-family:'Inter',sans-serif;border:1px solid transparent}
.btn-primary{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn-primary:hover{background:#178a64}
.btn-ghost{background:transparent;border-color:#d4d2cb;color:#1a1a18}
.btn-ghost:hover{background:#f0efe9}
.wrap{max-width:720px;margin:0 auto;padding:2rem}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.page-title{font-size:22px;font-weight:600}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.25rem}
.sum{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:.75rem 1rem}
.sum-label{font-size:11px;color:#5a5a55;margin-bottom:3px}
.sum-val{font-size:20px;font-weight:600;color:#1a1a18}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;border:1px solid #d4d2cb;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:#1a1a18;outline:none}
.search-wrap input:focus{border-color:#1D9E75}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:#8a8a85;pointer-events:none}
.rider-card{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:.875rem 1.25rem;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
.rider-card:hover{background:#f9f8f5}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:#f9f8f5;border:1px solid #e8e6e0}
.rider-info{flex:1;min-width:0}
.rider-name{font-size:14px;font-weight:500;color:#1a1a18;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rider-meta{font-size:12px;color:#5a5a55;margin-top:1px}
.rider-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.payment-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-overdue{background:#faeeda;color:#633806}
.badge-serious{background:#fcebeb;color:#791f1f}
.chevron{font-size:14px;color:#8a8a85}
.empty{text-align:center;padding:3rem 1rem}
.empty-icon{font-size:32px;margin-bottom:12px}
.empty-title{font-size:15px;font-weight:500;color:#1a1a18;margin-bottom:6px}
.empty-sub{font-size:13px;color:#5a5a55;margin-bottom:1.25rem}
.loading{text-align:center;padding:3rem;color:#8a8a85;font-size:14px}
</style>
</head>
<body>
<nav>
  <a href="dashboard.html" class="logo">Stirrup</a>
  <div class="nav-right">
    <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
    <a href="add-rider.html" class="btn btn-primary">+ Add rider</a>
  </div>
</nav>
<div class="wrap">
  <div class="page-head">
    <div class="page-title">Riders</div>
    <a href="add-rider.html" class="btn btn-primary">+ Add rider</a>
  </div>
  <div class="summary">
    <div class="sum"><div class="sum-label">Total riders</div><div class="sum-val" id="total-riders">—</div></div>
    <div class="sum"><div class="sum-label">Total lessons</div><div class="sum-val" id="total-lessons">—</div></div>
    <div class="sum"><div class="sum-label">Overdue payments</div><div class="sum-val" id="total-overdue">—</div></div>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search riders…" oninput="filterRiders()">
    </div>
  </div>
  <div id="rider-list"><div class="loading">Loading riders…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://mfinlbqfowymmklhkuhb.supabase.co';
const SUPABASE_KEY='sb_publishable_PcwbX1YoncwnrHobFmpAIA_L39K4XfK';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let allRiders=[],allBookings=[];

function getRiderBadge(createdAt){
  if(!createdAt)return'🌱';
  const months=(Date.now()-new Date(createdAt).getTime())/(1000*60*60*24*30.44);
  if(months>=18)return'🥇';
  if(months>=12)return'🥈';
  if(months>=6)return'🥉';
  return'🌱';
}

function getRiderPaymentStatus(riderId){
  const today=new Date();today.setHours(0,0,0,0);
  const riderBookings=allBookings.filter(b=>b.rider_id===riderId);
  const overdueWithNotice=riderBookings.find(b=>{
    if(b.payment_status==='paid')return false;
    if(!b.scheduled_date)return false;
    const d=new Date(b.scheduled_date);d.setHours(0,0,0,0);
    return d<today&&b.overdue_notice_sent===true;
  });
  if(overdueWithNotice)return'serious';
  const overdue=riderBookings.find(b=>{
    if(b.payment_status==='paid')return false;
    if(!b.scheduled_date)return false;
    const d=new Date(b.scheduled_date);d.setHours(0,0,0,0);
    return d<today;
  });
  if(overdue)return'overdue';
  return'current';
}

function getPaymentBadge(status){
  if(status==='serious')return'<span class="payment-badge badge-serious">⚠️ Notice sent</span>';
  if(status==='overdue')return'<span class="payment-badge badge-overdue">Payment due</span>';
  return'';
}

function filterRiders(){
  const q=document.getElementById('search').value.toLowerCase();
  const filtered=allRiders.filter(r=>{
    const name=(r.first_name+' '+r.last_name).toLowerCase();
    return name.includes(q)||(r.level||'').toLowerCase().includes(q);
  });
  renderRiders(filtered);
}

function renderRiders(riders){
  const list=document.getElementById('rider-list');
  document.getElementById('total-riders').textContent=allRiders.length;
  document.getElementById('total-lessons').textContent=allBookings.length;
  const overdue=allRiders.filter(r=>getRiderPaymentStatus(r.id)!=='current').length;
  document.getElementById('total-overdue').textContent=overdue;

  if(riders.length===0){
    list.innerHTML=`<div class="empty">
      <div class="empty-icon">🐴</div>
      <div class="empty-title">${allRiders.length===0?'No riders yet':'No riders match'}</div>
      <div class="empty-sub">${allRiders.length===0?'Add your first rider to get started.':'Try a different search.'}</div>
      ${allRiders.length===0?'<a href="add-rider.html" class="btn btn-primary">Add first rider</a>':''}
    </div>`;
    return;
  }

  list.innerHTML='';
  riders.forEach(r=>{
    const badge=getRiderBadge(r.created_at);
    const payStatus=getRiderPaymentStatus(r.id);
    const card=document.createElement('div');
    card.className='rider-card';
    card.onclick=()=>{localStorage.setItem('stirrup_viewing_rider',JSON.stringify(r));window.location.href='rider.html';};
    card.innerHTML=`
      <div class="av">${badge}</div>
      <div class="rider-info">
        <div class="rider-name">${r.first_name} ${r.last_name} ${getPaymentBadge(payStatus)}</div>
        <div class="rider-meta">${r.level||'No level'} · ${r.lesson_type||'No type'}</div>
      </div>
      <div class="rider-right">
        <span class="chevron">→</span>
      </div>`;
    list.appendChild(card);
  });
}

async function load(){
  const {data:{user}}=await db.auth.getUser();
  if(!user){window.location.href='login.html';return;}
  const [{data:riders},{data:bookings}]=await Promise.all([
    db.from('riders').select('*').eq('trainer_id',user.id).order('first_name',{ascending:true}),
    db.from('bookings').select('*').eq('trainer_id',user.id)
  ]);
  allRiders=riders||[];
  allBookings=bookings||[];
  filterRiders();
}

load();
</script>
</body>
</html>
