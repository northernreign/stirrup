<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riders — Stirrup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f9f8f5;color:#1a1a18;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;background:#fff;border-bottom:1px solid #e8e6e0}
.logo{font-size:18px;font-weight:600;color:#1a1a18;text-decoration:none}
.nav-right{display:flex;align-items:center;gap:12px}
.btn{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;font-family:'Inter',sans-serif;border:1px solid transparent}
.btn-primary{background:#1D9E75;border-color:#1D9E75;color:#fff}
.btn-primary:hover{background:#178a64}
.btn-ghost{background:transparent;border-color:#d4d2cb;color:#1a1a18}
.btn-ghost:hover{background:#f0efe9}
.wrap{max-width:720px;margin:0 auto;padding:2rem}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.page-title{font-size:22px;font-weight:600}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.25rem}
.sum{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:.75rem 1rem}
.sum-label{font-size:11px;color:#5a5a55;margin-bottom:3px}
.sum-val{font-size:20px;font-weight:600;color:#1a1a18}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem}
.search-wrap{flex:1;position:relative}
.search-wrap input{width:100%;padding:9px 12px 9px 34px;border:1px solid #d4d2cb;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:#1a1a18;outline:none}
.search-wrap input:focus{border-color:#1D9E75}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:15px;color:#8a8a85;pointer-events:none}
.filter-btns{display:flex;gap:6px}
.filter-btn{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid #d4d2cb;background:#fff;color:#5a5a55;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.filter-btn.active{background:#f0efe9;color:#1a1a18;border-color:#c8c6bf;font-weight:500}
.section-label{font-size:11px;font-weight:500;color:#8a8a85;margin:1rem 0 6px;letter-spacing:.03em;text-transform:uppercase}
.rider-card{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:.875rem 1.25rem;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
.rider-card:hover{background:#f9f8f5}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.rider-info{flex:1;min-width:0}
.rider-name{font-size:14px;font-weight:500;color:#1a1a18}
.rider-meta{font-size:12px;color:#5a5a55;margin-top:1px}
.rider-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.pill-green{background:#e0f5ed;color:#0f6e47}
.pill-amber{background:#faeeda;color:#633806}
.pill-gray{background:#f0efe9;color:#5a5a55}
.chevron{font-size:14px;color:#8a8a85}
.empty{text-align:center;padding:3rem 1rem}
.empty-icon{font-size:32px;margin-bottom:12px}
.empty-title{font-size:15px;font-weight:500;color:#1a1a18;margin-bottom:6px}
.empty-sub{font-size:13px;color:#5a5a55;margin-bottom:1.25rem}
</style>
</head>
<body>
<nav>
  <a href="dashboard.html" class="logo">Stirrup</a>
  <div class="nav-right">
    <a href="dashboard.html" class="btn btn-ghost">Dashboard</a>
    <a href="add-rider.html" class="btn btn-primary">+ Add rider</a>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="page-title">Riders</div>
    <a href="add-rider.html" class="btn btn-primary">+ Add rider</a>
  </div>

  <div class="summary">
    <div class="sum"><div class="sum-label">Total riders</div><div class="sum-val" id="total-riders">0</div></div>
    <div class="sum"><div class="sum-label">Lessons this week</div><div class="sum-val" id="total-lessons">0</div></div>
    <div class="sum"><div class="sum-label">Unpaid balances</div><div class="sum-val" id="total-unpaid">0</div></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search riders…" oninput="renderRiders()">
    </div>
    <div class="filter-btns">
      <button class="filter-btn active" id="f-all" onclick="setFilter('all')">All</button>
      <button class="filter-btn" id="f-unpaid" onclick="setFilter('unpaid')">Unpaid</button>
    </div>
  </div>

  <div id="rider-list"></div>
</div>

<script>
const avColors = [
  {bg:'#e0f5ed',fg:'#0f6e47'},
  {bg:'#faeeda',fg:'#633806'},
  {bg:'#eeedfe',fg:'#3c3489'},
  {bg:'#faece7',fg:'#712b13'},
  {bg:'#e6f0fb',fg:'#0c447c'},
];
let activeFilter = 'all';

function getInitials(name){
  const parts = name.trim().split(' ');
  return (parts[0]?.[0]||'') + (parts[1]?.[0]||'');
}

function setFilter(f){
  activeFilter = f;
  ['all','unpaid'].forEach(x=>{
    document.getElementById('f-'+x).classList.toggle('active', x===f);
  });
  renderRiders();
}

function renderRiders(){
  const riders = JSON.parse(localStorage.getItem('stirrup_riders') || '[]');
  const bookings = JSON.parse(localStorage.getItem('stirrup_bookings') || '[]');
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('rider-list');

  document.getElementById('total-riders').textContent = riders.length;
  document.getElementById('total-lessons').textContent = bookings.length;

  let filtered = riders.filter(r=>{
    const name = (r.firstName + ' ' + r.lastName).toLowerCase();
    const matchQ = name.includes(q) || (r.level||'').toLowerCase().includes(q);
    const matchF = activeFilter === 'all' || r.paymentStatus === 'unpaid';
    return matchQ && matchF;
  });

  const unpaid = riders.filter(r=>r.paymentStatus==='unpaid');
  document.getElementById('total-unpaid').textContent = unpaid.length;

  list.innerHTML = '';

  if(filtered.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🐴</div>
        <div class="empty-title">${riders.length===0?'No riders yet':'No riders match your search'}</div>
        <div class="empty-sub">${riders.length===0?'Add your first rider to get started.':'Try a different search or filter.'}</div>
        ${riders.length===0?'<a href="add-rider.html" class="btn btn-primary">Add first rider</a>':''}
      </div>`;
    return;
  }

  filtered.forEach((r,i)=>{
    const color = avColors[i % avColors.length];
    const initials = getInitials(r.firstName + ' ' + r.lastName).toUpperCase();
    const card = document.createElement('div');
    card.className = 'rider-card';
    card.onclick = ()=>{ localStorage.setItem('stirrup_viewing_rider', JSON.stringify(r)); window.location.href='rider.html'; };
    const pill = r.paymentStatus === 'unpaid'
      ? '<span class="pill pill-amber">unpaid</span>'
      : '<span class="pill pill-green">paid</span>';
    card.innerHTML = `
      <div class="av" style="background:${color.bg};color:${color.fg}">${initials||'?'}</div>
      <div class="rider-info">
        <div class="rider-name">${r.firstName} ${r.lastName}</div>
        <div class="rider-meta">${r.level||'No level set'} · ${r.lessonType||'No lesson type'}</div>
      </div>
      <div class="rider-right">
        ${pill}
        <span class="chevron">→</span>
      </div>`;
    list.appendChild(card);
  });
}

renderRiders();
</script>
</body>
</html>
